[package]
name = "lsfdump"
version = "0.1.0"
edition = "2021"
description = "Reads Larian .lsf resource files directly and writes them as compact event streams for gameindex.py"

[dependencies]
lz4_flex = "0.11"
ruzstd = "0.7"
rayon = "1.10"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
