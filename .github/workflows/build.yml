name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive       # external/lslib: GateKit.GameData compiles it
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build --configuration Release
      # The game itself cannot run here: these are the unit tests (unit/), which need no game.
      - run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx"
      # registry/README.md: every entry valid and at its path, every citation resolved, the refusals.
      - name: registry check
        run: dotnet src/GateKit.Cli/bin/Release/net10.0/gatekit.dll registry check --full --notes 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/*.trx"

  lua:
    name: lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luarocks && sudo luarocks install luacheck
      # What stops a merge: Lua that does not parse (luacheck's codes 0xx). A file that does not
      # parse breaks the game's Lua for every mod; everything else luacheck says is advice.
      - name: Lua parses
        run: luacheck mods tests lua-types --codes --only 0
      # The rest - unused values, shadowing, globals a scene keeps on purpose - is reported for a
      # reader and does not fail the run: hundreds of such lines were failing every push while
      # pointing at nothing broken.
      - name: Lua advice (does not fail)
        continue-on-error: true
        run: luacheck mods tests lua-types --codes --formatter plain | tail -n 200; luacheck mods tests lua-types --codes | tail -n 1

  texts:
    name: repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: English only
        # CONTRIBUTING.md: English everywhere, with no exceptions; a test that needs other
        # alphabets writes them as escapes.
        run: |
          # -I skips binary files: a PNG or a JPEG hits a Cyrillic byte sequence by chance often
          # enough that six of the brand images were reported as non-English prose.
          hits=$(grep -rnIP '[\p{Cyrillic}]' --exclude-dir=.git --exclude-dir=external . || true)
          if [ -n "$hits" ]; then echo "non-English text:"; echo "$hits"; exit 1; fi
      - name: No machine-specific paths
        # Documentation is where these actually turn up, so `.md` is not excluded any more: a
        # path to one person's disk is no more use to a reader in prose than it is in code, and
        # excluding prose made this check pass while every such path in the repository survived.
        # `research/` stays exempt by CONTRIBUTING.md, being working notes rather than the
        # toolkit. A path under Program Files is a documented default rather than a leak, so only
        # the drives this is worked on and the user profile count.
        run: |
          hits=$(grep -rnE '([A-Z]:\\\\|[A-Z]:/)(Users|bg3|bg-shields)' \
                 --exclude-dir=.git --exclude-dir=research --exclude-dir=external . || true)
          if [ -n "$hits" ]; then echo "machine paths:"; echo "$hits"; exit 1; fi
      - name: Nothing of Larian's
        run: |
          hits=$(git ls-files '*.pak' '*.dds' '*.DDS' '*.lsf' '*.lsb' '*.ttf' '*.otf' \
                 | grep -vE '^(tools/brand/fonts/|external/)' || true)
          if [ -n "$hits" ]; then echo "game-derived files committed:"; echo "$hits"; exit 1; fi

  signature:
    name: the bot signs its work
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # .github/thrall.md: one name in the history, whichever assistant wrote the code.
      - name: No assistant signs a commit under its own name
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          named=$(git log --format='%H %(trailers:key=Co-Authored-By,valueonly)' "$base..$head" |
            grep -iE 'claude|gpt|openai|codex|copilot|gemini|cursor|windsurf|devin|anthropic' || true)
          if [ -n "$named" ]; then
            echo "these commits name an assistant as co-author; use GateKit Thrall (.github/thrall.md):"
            echo "$named"; exit 1
          fi
      - name: A pull request from the bot carries the signature
        if: contains(github.event.pull_request.user.login, 'gatekit-thrall')
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          line="Generated by GateKit bot, loyal"
          case "$BODY" in
            *"$line"*) echo "signed" ;;
            *) echo "a pull request by the bot must end with the line in .github/thrall.md"; exit 1 ;;
          esac
