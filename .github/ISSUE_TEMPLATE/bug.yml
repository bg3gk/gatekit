name: Something is broken
description: GateKit did not do what it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        GateKit is experimental and breaks; thank you for saying how. Nothing here is required —
        a sentence and a command is better than nothing.
  - type: textarea
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got. Paste the error if there is one.
    validations:
      required: true
  - type: textarea
    attributes:
      label: gatekit doctor
      description: Its output tells us your platform, your game and your settings in one go.
      render: text
  - type: input
    attributes:
      label: Game version
      description: The game's patch, and whether it is a Steam copy.
      placeholder: Patch 8 (4.1.1.x), Steam
  - type: checkboxes
    attributes:
      label: Before you post
      options:
        - label: The paths in what I pasted are ones I am happy to make public.
